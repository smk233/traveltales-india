apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: traveltales
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: smk233/traveltales-backend-beta:v3
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI  # Change this to whatever env var your app uses
          value: "mongodb://mongodb-service:27017/traveltales"
        - name: REDIS_HOST # Change this to whatever env var your app uses
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: traveltales
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 31100
