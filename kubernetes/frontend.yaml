apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: traveltales
  labels:
    app: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      name: frontend
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: smk233/traveltales-frontend-beta:v4
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: traveltales

spec:
  type: NodePort
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 31000
